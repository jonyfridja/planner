services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-planner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-planner}
      POSTGRES_DB: ${DB_NAME:-planner}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - planner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-planner}
      DB_PASSWORD: ${DB_PASSWORD:-planner}
      DB_NAME: ${DB_NAME:-planner}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    # No host port: reached at web:80 over the internal docker network via the
    # `proxy` service below (which is the box's single public entry point).

  # --- Web activity tracking (Phase 3) ---
  # Reuses the existing `db` Postgres container (separate `umami` database).
  # Unlike the ops dashboards below, this needs to be reachable by real visitors'
  # browsers (tracking script + collect endpoint), so it is fronted by the `proxy`
  # service at /umami/ rather than gated behind the "monitoring" profile. Create
  # the database once before first boot:
  #   docker compose exec db psql -U ${DB_USERNAME:-planner} -c "CREATE DATABASE umami;"
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-planner}:${DB_PASSWORD:-planner}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    # No host port: reached at umami:3000 over the internal docker network via the
    # `proxy` service below.

  # --- Edge reverse proxy ---
  # The single public entry point on the box. Listens on :80 and dispatches by
  # path to the right service over the internal docker network (see
  # proxy/nginx.conf) — so the Cloudflare Tunnel only needs one ingress rule
  # (hostname -> this Pi's :80) instead of one per service/port.
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - umami
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # --- Monitoring (Phase 1: near-zero-config) ---
  # Ops dashboards below are published on the Pi's ports but intentionally NOT
  # wired into the public Cloudflare Tunnel — reach them over SSH tunnel/LAN/Tailscale.
  # Gated behind the "monitoring" profile so plain local-dev `docker compose up -d`
  # doesn't also mount the host's /proc, /sys, and docker.sock. Enable on the deploy
  # host by setting COMPOSE_PROFILES=monitoring in the root .env there.

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data

  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    profiles: ["monitoring"]
    hostname: planner-pi
    ports:
      - "${NETDATA_PORT:-19999}:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- Error tracking (Phase 4) ---
  # Reuses the existing `db` Postgres container (separate `glitchtip` database).
  # GlitchTip's own dashboard is ops-only, like the monitors above — reach it over
  # SSH tunnel/LAN/Tailscale rather than the public Cloudflare Tunnel. `api` always
  # needs to be able to report errors to it, so it is not gated behind the
  # "monitoring" profile. Create the database once before first boot:
  #   docker compose exec db psql -U ${DB_USERNAME:-planner} -c "CREATE DATABASE glitchtip;"
  glitchtip-redis:
    image: redis:alpine
    restart: unless-stopped

  glitchtip:
    image: glitchtip/glitchtip
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-planner}:${DB_PASSWORD:-planner}@db:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:${GLITCHTIP_PORT:-8001}}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
    ports:
      - "${GLITCHTIP_PORT:-8001}:8000"

volumes:
  planner_db_data:
  uptime_kuma_data:
