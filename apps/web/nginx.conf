server {
    listen 80;
    server_name _;

    # Served at projects.jonyfridja.com/planner via a path-routed Cloudflare Tunnel
    # ingress rule, which forwards the full "/planner/..." path unchanged — so this
    # container must itself serve everything under that prefix (see vite.config.ts
    # base and main.tsx basename, which are built against the same assumption).

    location = /planner {
        return 301 /planner/;
    }

    location /planner/api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /planner/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /planner/index.html;
    }
}
