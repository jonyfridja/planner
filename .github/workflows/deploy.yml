name: Deploy to Raspberry Pi

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PI_USERNAME: jonyfridja
  CF_SSH_HOSTNAME: ssh.jonyfridja.com
  PI_DEPLOY_PATH: /home/jonyfridja/projects/planner

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planner:planner@localhost:5432/planner
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Set up deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Sync DATABASE_URL secret to Pi .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATABASE_URL_B64=$(printf '%s' "$DATABASE_URL" | base64 -w0)
          ssh -o "ProxyCommand=cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/deploy_key \
              "$PI_USERNAME@$CF_SSH_HOSTNAME" \
              "cd $PI_DEPLOY_PATH && touch .env && value=\$(echo $DATABASE_URL_B64 | base64 -d) && grep -v '^DATABASE_URL=' .env > .env.tmp; printf 'DATABASE_URL=%s\n' \"\$value\" >> .env.tmp && mv .env.tmp .env"

      - name: Deploy over SSH via Cloudflare Access
        run: |
          ssh -o "ProxyCommand=cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/deploy_key \
              "$PI_USERNAME@$CF_SSH_HOSTNAME" \
              "cd $PI_DEPLOY_PATH && git pull --ff-only && docker compose up -d --build && docker compose exec -T proxy nginx -t && docker compose exec -T proxy nginx -s reload"
