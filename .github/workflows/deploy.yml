name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Deploy over SSH via Cloudflare Access
        run: |
          ssh -o "ProxyCommand=cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/deploy_key \
              "${{ secrets.PI_USERNAME }}@${{ secrets.CF_SSH_HOSTNAME }}" \
              "cd ${{ secrets.PI_DEPLOY_PATH }} && git pull --ff-only && docker compose up -d --build"
