name: Deploy to Raspberry Pi

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PI_USERNAME: jonyfridja
  CF_SSH_HOSTNAME: ssh.jonyfridja.com
  PI_DEPLOY_PATH: /home/jonyfridja/projects/planner

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: planner
      DB_PASSWORD: planner
      DB_NAME: planner
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          # Pinned to 2026.5.1: 2026.6.0+ has a regression where `access ssh` ignores
          # service-token credentials and falls back to interactive browser auth.
          # https://github.com/cloudflare/cloudflared/issues/1673
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key

      - name: Deploy over SSH via Cloudflare Access
        run: |
          ssh -o "ProxyCommand=cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/deploy_key \
              "$PI_USERNAME@$CF_SSH_HOSTNAME" \
              "cd $PI_DEPLOY_PATH && git pull --ff-only && docker compose up -d --build"
