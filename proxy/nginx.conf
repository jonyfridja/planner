server {
    listen 80;
    server_name _;

    # Single entry point for the whole box: the Cloudflare Tunnel has one ingress
    # rule (hostname -> this container's :80) and everything below it is dispatched
    # by path to the right service over the internal docker network. Add a location
    # here whenever a new service needs to be reachable by real visitors' browsers.

    location = /planner {
        return 301 /planner/;
    }

    location /planner/ {
        proxy_pass http://web:80/planner/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /planner-umami/ {
        proxy_pass http://umami:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /positions {
        return 301 /positions/;
    }

    location /positions/ {
        proxy_pass http://web:80/positions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
